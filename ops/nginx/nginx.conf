user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 8m;
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /var/log/nginx/access.log json;

  upstream propcompare_web {
    include /etc/nginx/upstream/active.conf;
    keepalive 32;
  }
  include /etc/nginx/conf.d/*.conf;
}
