logging:
  receivers:
    docker_json:
      type: files
      include_paths: [/var/lib/docker/containers/*/*-json.log]
  service:
    pipelines:
      default_pipeline:
        receivers: [docker_json]
metrics:
  receivers:
    hostmetrics:
      type: hostmetrics
      collection_interval: 60s
  service:
    pipelines:
      default_pipeline:
        receivers: [hostmetrics]
