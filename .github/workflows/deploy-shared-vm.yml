name: Deploy (shared VM)

on:
  push:
    branches: [main]

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: propcompare-shared-vm
      cancel-in-progress: false
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy over IAP SSH
        env:
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        run: |
          VM_NAME=$(echo "$VM_NAME" | tr -d '[:space:]')
          PROJECT_ID=$(echo "$PROJECT_ID" | tr -d '[:space:]')
          VM_ZONE=$(echo "$VM_ZONE" | tr -d '[:space:]')
          gcloud compute ssh "$VM_NAME" \
            --project "$PROJECT_ID" \
            --zone "$VM_ZONE" \
            --tunnel-through-iap --quiet \
            --command="bash ~/propcompare/ops/deploy-shared-vm.sh"
