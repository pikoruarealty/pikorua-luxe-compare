name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - security-and-cosmetics

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun x tsc --noEmit
      - run: bun run test
      - run: bun run check
      - run: bun run schema:check
      - run: bun run db:drift
      - run: bun run build
      - run: bun run check:built-leakage

  ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: property-ocr-suite/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: property-ocr-suite/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
        env:
          ALLOW_INSECURE_LOCAL: "1"

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propcompare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d propcompare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Replay migrations on plain PostgreSQL
        run: >-
          docker run --rm --network host
          -v "$GITHUB_WORKSPACE":/repo -w /repo
          -e PGURL="postgresql://postgres:postgres@127.0.0.1:5432/propcompare"
          postgres:16-alpine
          sh -c "apk add --no-cache bash >/dev/null && psql \"\$PGURL\" -v ON_ERROR_STOP=1 -f ops/db/bootstrap.sql >/dev/null && bash ops/db/migrate.sh"

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production web image
        run: docker build --build-arg RELEASE_SHA=${{ github.sha }} -t propcompare-web:ci .
      - name: Build production OCR image
        run: docker build -f property-ocr-suite/backend/Dockerfile.worker -t propcompare-ocr:ci property-ocr-suite/backend
