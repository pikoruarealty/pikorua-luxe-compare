name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - security-and-cosmetics

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun x tsc --noEmit
      - run: bun run test
      - run: bun run check
      - run: bun run build

  ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: property-ocr-suite/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: property-ocr-suite/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
        env:
          ALLOW_INSECURE_LOCAL: "1"

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset --local
