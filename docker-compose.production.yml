services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /run/propcompare/db.env
    volumes:
      - propcompare-db-data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web-blue:
    image: ${WEB_BLUE_IMAGE:?Set WEB_BLUE_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: /run/propcompare/web.env
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      CSP_ENFORCE: "1"
      STAFF_MFA_ENFORCE: "0"
    expose: ["3000"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web-green:
    image: ${WEB_GREEN_IMAGE:?Set WEB_GREEN_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: /run/propcompare/web.env
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      CSP_ENFORCE: "1"
      STAFF_MFA_ENFORCE: "0"
    expose: ["3000"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ocr-worker:
    image: ${OCR_WORKER_IMAGE:?Set OCR_WORKER_IMAGE}
    build:
      context: ./property-ocr-suite/backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: /run/propcompare/ocr.env
    environment:
      APP_ENV: production
      V2_OCR: "1"
    mem_limit: 1g
    cpus: 1

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web-blue:
        condition: service_healthy
      web-green:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/site.conf.template:/etc/nginx/templates/site.conf.template:ro
      - ./ops/nginx/active-upstream.conf:/etc/nginx/upstream/active.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    mem_limit: 128m
    cpus: 0.5
    environment:
      PROPCOMPARE_DOMAIN: ${PROPCOMPARE_DOMAIN:?Set PROPCOMPARE_DOMAIN}
      NGINX_ENVSUBST_FILTER: PROPCOMPARE_DOMAIN

volumes:
  propcompare-db-data:
    name: propcompare-db-data

networks:
  default:
    name: propcompare-production
